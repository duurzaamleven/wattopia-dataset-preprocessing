[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattopia-preprocessing"
version = "0.1.0"
description = "Preprocessing van de Wattopia-dataset Woningprestaties naar getypeerde, herleidbare Parquet-tabellen (raw -> standardized -> derived)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=17,<26",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    # optioneel: valideert datapackage.json tegen de Frictionless-specificatie (de toets wordt anders overgeslagen)
    "frictionless>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattopia_preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# De toets op de echte data staat standaard uit; draai hem met: pytest -m echte_data
addopts = "-m 'not echte_data'"
markers = [
    "echte_data: toets op de echte data in data/raw/ (traag; standaard overgeslagen)",
]
